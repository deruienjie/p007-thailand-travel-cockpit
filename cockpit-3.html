</style></head><body><main class="page"><header class="head"><div class="eyebrow">P-007（泰国旅行项目编号） · 泰国旅行</div><div class="headrow"><div><h1>驾驶舱 3 号｜每天快速看</h1><p>先看时间、做什么、怎么去；照片和完整细节仍在 2 号</p></div><a class="full" href="cockpit-2.html">完整图文 2 号 ↗</a></div></header><nav id="tabs" class="tabs" aria-label="选择旅行日期"></nav><section id="dayhead" class="dayhead"></section><section id="timeline" class="timeline" aria-live="polite"></section><footer class="foot">地图按钮会打开 Google Maps（谷歌地图）；交通、耗时、费用与评分为行程参考快照，出发前看实时情况。<br><a href="cockpit-2.html">需要看地点照片、店铺识别和更多细节？打开驾驶舱 2 号 ↗</a></footer></main><script>const DATA={"days":{"D1":{"label":"第一天","date":"9月26日","title":"BKK 机场 → Samala Hotel","mapNote":"行李多或晚点：直接 Grab；机场快线＋MRT 只在体力和时间允许时使用。","stops":[{"time":"18:55–20:00","type":"hotel","title":"入境、取行李、换少量现金","desc":"先完成入境和行李，再处理网络、现金和洗手间。不要在机场内临时增加景点。","map":"https://www.google.com/maps/search/%E5%85%A5%E5%A2%83%E3%80%81%E5%8F%96%E8%A1%8C%E6%9D%8E%E3%80%81%E6%8D%A2%E5%B0%91%E9%87%8F%E7%8E%B0%E9%87%91%20Thailand"},{"time":"20:00–21:00","type":"drive","title":"机场 → Samala Hotel Bangkok","desc":"行李多或晚点优先 Grab；机场快线＋MRT 只作为体力和时间允许时的方案。","map":"https://www.google.com/maps/search/%E6%9C%BA%E5%9C%BA%20%E2%86%92%20Samala%20Hotel%20Bangkok%20Thailand"},{"time":"21:00–21:30","type":"hotel","title":"办理入住、放行李、检查充电","desc":"确认第二天出门方式，顺手确认插座、吹风机和洗漱用品。","map":"https://www.google.com/maps/search/%E5%8A%9E%E7%90%86%E5%85%A5%E4%BD%8F%E3%80%81%E6%94%BE%E8%A1%8C%E6%9D%8E%E3%80%81%E6%A3%80%E6%9F%A5%E5%85%85%E7%94%B5%20Thailand"},{"time":"21:30–22:15","type":"hotel","title":"酒店内晚餐或补给","desc":"优先 Mariga 或酒店附近补给；如果入境或交通延误，直接取消外出。","map":"https://www.google.com/maps/search/%E9%85%92%E5%BA%97%E5%86%85%E6%99%9A%E9%A4%90%E6%88%96%E8%A1%A5%E7%BB%99%20Thailand"}]},"D2":{"label":"第二天","date":"9月27日","title":"恰图恰 → 暹罗 → Banthat Thong","mapNote":"上午只做一个大市场；下午集中逛 OneSiam，晚上只保留一条夜间线。","stops":[{"time":"09:30–12:30","type":"","title":"恰图恰周末市场","desc":"先逛目标区域，再决定是否继续；不为了打卡横穿市场。","map":"https://www.google.com/maps/search/%E6%81%B0%E5%9B%BE%E6%81%B0%E5%91%A8%E6%9C%AB%E5%B8%82%E5%9C%BA%20Thailand"},{"time":"12:30–13:15","type":"food","title":"168 Thai Restaurant · Project 3 附近","desc":"逛完直接吃，先解决座位和饮水，再决定是否继续逛市场。","map":"https://www.google.com/maps/search/168%20Thai%20Restaurant%20%C2%B7%20Project%203%20%E9%99%84%E8%BF%91%20Thailand"},{"time":"13:30–14:00","type":"drive","title":"恰图恰 → 暹罗","desc":"把移动段单独留出来，不把“市场结束”直接等同于“马上开始购物”。","map":"https://www.google.com/maps/search/%E6%81%B0%E5%9B%BE%E6%81%B0%20%E2%86%92%20%E6%9A%B9%E7%BD%97%20Thailand"},{"time":"14:00–14:30","type":"","title":"KONVY · Siam Center M 层","desc":"先完成最明确的美妆购物目标；从 BTS Siam 连接口进 Siam Center，认 KONVY 大招牌。","map":"https://www.google.com/maps/search/KONVY%20%C2%B7%20Siam%20Center%20M%20%E5%B1%82%20Thailand"},{"time":"14:30–15:10","type":"","title":"Siam Discovery · G 层入口","desc":"从 Siam Center 主通道沿连廊进入玻璃入口；先认建筑，再按体力挑店。","map":"https://www.google.com/maps/search/Siam%20Discovery%20%C2%B7%20G%20%E5%B1%82%E5%85%A5%E5%8F%A3%20Thailand"},{"time":"15:10–15:40","type":"drive","title":"二楼步行天桥 → OneSiam Skywalk","desc":"顺着商场连廊往 CentralWorld 方向走，拍 BTS 和商圈连接景；这一段是从 Siam 走到下一站的连接段。","map":"https://www.google.com/maps/search/%E4%BA%8C%E6%A5%BC%E6%AD%A5%E8%A1%8C%E5%A4%A9%E6%A1%A5%20%E2%86%92%20OneSiam%20Skywalk%20Thailand"},{"time":"15:40–16:25","type":"food","title":"PASTA AMA · CentralWorld 7F","desc":"从 OneSiam Skywalk 进入 CentralWorld，直接找 7F Zone B；抖音博主推荐的辣味培根奶油意面按现场菜单确认。","map":"https://www.google.com/maps/search/PASTA%20AMA%20%C2%B7%20CentralWorld%207F%20Thailand"},{"time":"16:25–16:45","type":"","title":"Nineties · Siam Square Soi 2","desc":"先看复古街头服饰和 graphic tees；认红色门面和 Nineties 标识，按现场入口为准。","map":"https://www.google.com/maps/search/Nineties%20%C2%B7%20Siam%20Square%20Soi%202%20Thailand"},{"time":"16:45–17:05","type":"food","title":"Matchbox · Siam Square Soi 7","desc":"从 Nineties 沿 Siam Square 主街走到 Soi 7，认整栋粉色三层建筑；二楼偏美妆，三楼有咖啡空间。","map":"https://www.google.com/maps/search/Matchbox%20%C2%B7%20Siam%20Square%20Soi%207%20Thailand"},{"time":"17:05–17:30","type":"","title":"Gentle Woman · Siam Square Main Street","desc":"最后看女装 / 包袋；优先认 Siam Square 黑白英文标志，不要误走到 CentralWorld 分店。","map":"https://www.google.com/maps/search/Gentle%20Woman%20%C2%B7%20Siam%20Square%20Main%20Street%20Thailand"},{"time":"17:30–18:00","type":"food","title":"暹罗 → Banthat Thong","desc":"从 CentralWorld / Siam 方向转去 Banthat Thong；先看交通和取号情况，晚餐不要卡死在 18:00 正点。","map":"https://www.google.com/maps/search/%E6%9A%B9%E7%BD%97%20%E2%86%92%20Banthat%20Thong%20Thailand"},{"time":"18:00–19:30","type":"food","title":"Som Som Seafood · Banthat Thong","desc":"先解决主餐，再决定是否继续夜市小吃；视频里的海鲜菜品按现场菜单和当天排队情况取舍。","map":"https://www.google.com/maps/search/Som%20Som%20Seafood%20%C2%B7%20Banthat%20Thong%20Thailand"},{"time":"19:30–20:15","type":"food","title":"Banthat Thong 夜市小份加餐","desc":"爆浆吐司、榴莲、迷你菠萝只选一到两个；如果已经吃饱，直接跳过，不再硬塞唐人街。","map":"https://www.google.com/maps/search/Banthat%20Thong%20%E5%A4%9C%E5%B8%82%E5%B0%8F%E4%BB%BD%E5%8A%A0%E9%A4%90%20Thailand"},{"time":"20:15–20:45","type":"hotel","title":"回 Samala Hotel Bangkok","desc":"回酒店洗澡、充电、整理第二天三寺行程；体力不足时不再追加耀华力路。","map":"https://www.google.com/maps/search/%E5%9B%9E%20Samala%20Hotel%20Bangkok%20Thailand"}]},"D3":{"label":"第三天","date":"9月28日","title":"大皇宫 → 卧佛寺 → 郑王庙 → ICONSIAM","mapNote":"三寺按上午主线走；郑王庙后过河转 ICONSIAM，晚餐不再跨城。","stops":[{"time":"08:00–08:45","type":"drive","title":"酒店 → 大皇宫","desc":"早点出发，避开上午车流；大皇宫每日 08:30 开始入场，外国游客售票到 15:30。穿遮肩、过膝衣物，门票/入口以官网当天公告为准。","map":"https://www.google.com/maps/dir/?api=1&origin=Samala%20Hotel%20Bangkok&destination=The%20Grand%20Palace%20Bangkok"},{"time":"08:45–11:00","type":"","title":"大皇宫","desc":"留约 2 小时 15 分钟看主区并应对排队；不要为了拍照拖过中午。","map":"https://www.google.com/maps/search/?api=1&query=The%20Grand%20Palace%20Bangkok","sources":[["大皇宫官网开放与售票时间","https://www.royalgrandpalace.th/en/visit/faq"]]},{"time":"11:00–11:15","type":"drive","title":"大皇宫 → 卧佛寺","desc":"相邻景点步行转场，按现场入口和人行道走；这里不需要打车。","map":"https://www.google.com/maps/dir/?api=1&origin=The%20Grand%20Palace%20Bangkok&destination=Wat%20Pho%20Bangkok"},{"time":"11:15–12:15","type":"","title":"卧佛寺","desc":"以卧佛主殿和寺院重点区域为主，预留脱鞋、排队和补水时间；寺院官网开放至 19:30。","map":"https://www.google.com/maps/search/?api=1&query=Wat%20Pho%20Bangkok","sources":[["卧佛寺官网参观信息","https://watpho.org/en/contact/plan"]]},{"time":"12:15–12:25","type":"drive","title":"卧佛寺 → 塔田午餐区","desc":"步行到 Tha Tien（塔田）附近吃饭，不跨区。","map":"https://www.google.com/maps/dir/?api=1&origin=Wat%20Pho%20Bangkok&destination=Tha%20Tien%20Bangkok"},{"time":"12:25–13:05","type":"food","title":"卧佛寺后午餐 · Tha Tien 塔田码头附近","desc":"在塔田步行范围选一间，控制在 40 分钟；看队伍慢就选邻近简餐。下面 3 家为地图候选，营业和等位以现场为准。","map":"https://www.google.com/maps/search/?api=1&query=restaurants%20near%20Tha%20Tien%20Bangkok"},{"time":"13:05–13:30","type":"drive","title":"塔田码头 → 郑王庙","desc":"步行到 Tha Tien 码头、买票过河；摆渡很短，25 分钟含等船缓冲。按现场船班执行。","map":"https://www.google.com/maps/dir/?api=1&origin=Tha%20Tien%20Pier%20Bangkok&destination=Wat%20Arun%20Bangkok"},{"time":"13:30–14:40","type":"","title":"郑王庙","desc":"留约 70 分钟拍主塔与河岸；穿防滑鞋，攀爬区域按现场开放提示。","map":"https://www.google.com/maps/search/?api=1&query=Wat%20Arun%20Bangkok","sources":[["郑王庙官网","https://www.wat-arun.com/"]]},{"time":"14:40–15:30","type":"drive","title":"郑王庙 → ICONSIAM","desc":"优先查湄南河观光船当日班次：官网列有郑王庙与 ICONSIAM 码头，约每 30 分钟一班；本段 50 分钟含候船缓冲。若船班不合，再用 Grab。","map":"https://www.google.com/maps/dir/?api=1&origin=Wat%20Arun%20Pier%20Bangkok&destination=ICONSIAM%20Bangkok"},{"time":"15:30–15:50","type":"drive","title":"ICONSIAM 码头 → 商场入口","desc":"下船后跟随商场指示进 G 层，先定位入口和洗手间，不急着开逛。","map":"https://www.google.com/maps/dir/?api=1&origin=ICONSIAM%20Pier&destination=ICONSIAM%20Bangkok"},{"time":"15:50–19:00","type":"","title":"ICONSIAM（暹罗天地）· G 层与重点楼层","desc":"先逛 G 层 SookSiam（暹罗天地水上市场主题区），再按体力选 1–2 个楼层；不要全场横穿。若当天河岸活动/喷泉时间合适再看，别为此压缩晚餐。","map":"https://www.google.com/maps/search/?api=1&query=ICONSIAM%20Bangkok"},{"time":"19:00–19:50","type":"food","title":"ICONSIAM 内解决晚餐","desc":"首选商场内吃饭，按门头、菜单、排队和预算决定；下方是 3 家店铺候选。","map":"https://www.google.com/maps/search/?api=1&query=restaurants%20ICONSIAM%20Bangkok"},{"time":"19:50–20:30","type":"drive","title":"ICONSIAM → Samala Hotel Bangkok","desc":"晚饭后直接 Grab 回酒店，按实时车况约 20–40 分钟；不再加跨区夜市。","map":"https://www.google.com/maps/dir/?api=1&origin=ICONSIAM%20Bangkok&destination=Samala%20Hotel%20Bangkok"}]},"D4":{"label":"第四天","date":"9月29日","title":"曼谷 → 芭提雅 → 真理寺 → Terminal 21","mapNote":"上午完成跨城和入住，下午只安排真理寺与 Terminal 21；每一段转场单独看路线卡。","stops":[{"time":"07:30–08:00","type":"hotel","title":"早餐、退房、检查行李","desc":"护照、充电器、泳衣和第二天海岛用品放入随身包；退房前再看床头、浴室和插座。","map":"https://www.google.com/maps/search/Samala+Hotel+Bangkok"},{"time":"08:00–08:30","type":"drive","title":"Samala Hotel → Ekkamai 车站","desc":"带行李直接 Grab 到 Ekkamai；到站后先找售票窗口和卫生间。","map":"https://www.google.com/maps/search/Ekkamai+Bus+Terminal+Bangkok"},{"time":"08:30–09:00","type":"spot","title":"买票、找站台、买水","desc":"确认去芭提雅北站的大巴班次、座位和行李放置；把水和纸巾放在座位旁。","map":"https://www.google.com/maps/search/Ekkamai+Bus+Terminal+Bangkok"},{"time":"09:00–12:00","type":"drive","title":"Ekkamai → 芭提雅北站","desc":"城际大巴按约 2–3 小时留缓冲；曼谷出城/路况可能拖长，不把 11:30 当保证到站时间。","map":"https://www.google.com/maps/dir/?api=1&origin=Ekkamai+Bus+Terminal+Bangkok&destination=Pattaya+North+Bus+Terminal"},{"time":"12:00–12:25","type":"drive","title":"芭提雅北站 → Mytt Hotel Pattaya","desc":"到站后直接 Grab 到酒店，先放行李；提前入住以酒店现场为准。","map":"https://www.google.com/maps/dir/?api=1&origin=Pattaya+North+Bus+Terminal&destination=Mytt+Hotel+Pattaya"},{"time":"12:25–12:45","type":"hotel","title":"Mytt 放行李、办理入住","desc":"先寄存行李、补水；不要把提前入住当作确定。","map":"https://www.google.com/maps/search/Mytt+Hotel+Pattaya"},{"time":"12:45–13:15","type":"food","title":"芭提雅到店午餐候选 · Mytt 附近","desc":"先在酒店附近快速午餐，控制 30 分钟；下方 3 家候选只选营业且排队短的一家。","map":"https://www.google.com/maps/search/restaurants+near+Mytt+Hotel+Pattaya"},{"time":"13:15–13:40","type":"drive","title":"Mytt → 真理寺","desc":"Grab 到真理寺；按预约/现场入口下车，预留检票与排队。","map":"https://www.google.com/maps/dir/?api=1&origin=Mytt+Hotel+Pattaya&destination=Sanctuary+of+Truth+Pattaya"},{"time":"13:40–14:10","type":"","title":"真理寺检票、戴安全帽、等中文导览","desc":"到场后买票/核票、听安全提示、戴安全帽并确认 14:10 中文导览集合点；如果交通晚点，先向入口工作人员问下一场。","map":"https://www.google.com/maps/search/?api=1&query=Sanctuary%20of%20Truth%20Pattaya"},{"time":"14:10–16:10","type":"spot","title":"真理寺","desc":"优先参加官网列出的每日 14:10 中文导览；官方参观约需 2–4 小时，这里按 2 小时紧凑看重点，若想慢逛就删减 Terminal 21 楼层，不要压缩导览。入场、着装、安全帽以现场为准。","map":"https://www.google.com/maps/search/Sanctuary+of+Truth+Pattaya"},{"time":"16:10–16:40","type":"drive","title":"真理寺 → Terminal 21 Pattaya","desc":"这一段是打车转场，不是逛商场：从真理寺正门上 Grab，到 Terminal 21 Pattaya 主入口下车；进门先认入口与扶梯。进商场后的楼层路线从下一段开始，按 GF Paris → MF London → 1F Istanbul → 2F Tokyo → 3F San Francisco → 4F Hollywood 单向上行。","map":"https://www.google.com/maps/dir/?api=1&origin=Sanctuary+of+Truth+Pattaya&destination=Terminal+21+Pattaya"},{"time":"16:40–17:10","type":"spot","title":"Terminal 21：GF Paris → MF London，入口拍照＋GF 店铺","desc":"16:40–16:50 从主入口进入 GF Paris，认巴黎主题入口；16:50–17:00 看 EVEANDBOY（G019–G022）与 Jaspal（G030–G033）门头；17:00–17:10 上 MF London。只看目标店，不久逛。","map":"https://www.google.com/maps/search/Terminal+21+Pattaya"},{"time":"17:10–17:40","type":"spot","title":"Terminal 21：1F Istanbul → 2F Tokyo，主题层＋MINISO","desc":"17:10–17:20 看 1F Istanbul；17:20–17:30 上 2F Tokyo，找 MINISO（名创优品）并看楼层牌；17:30–17:40 上 3F，不折返。","map":"https://www.google.com/maps/search/Terminal+21+Pattaya"},{"time":"17:40–18:10","type":"spot","title":"Terminal 21：3F San Francisco，拍照后上 4F 找 Pier 21","desc":"17:40–17:55 拍 3F San Francisco（旧金山主题层）；17:55–18:05 上 4F Hollywood（好莱坞主题层）；18:05 前找到 PIER21（21号码头美食广场）入口和队尾。PIER21 在 4F。","map":"https://www.google.com/maps/search/Pier+21+Terminal+21+Pattaya"},{"time":"18:10–18:55","type":"food","title":"晚餐：PIER21 Food Court · Terminal 21 Pattaya 4F","desc":"先看档口与队伍，选一份主食和饮品；下方 3 家是商场餐饮候选，PIER21 现场档口不强行编店名。18:55 准时收口。","map":"https://www.google.com/maps/search/Pier+21+Terminal+21+Pattaya"},{"time":"18:55–19:20","type":"spot","title":"Terminal 21：4F Hollywood，最后拍照＋确认回酒店上车点","desc":"在 4F Hollywood（好莱坞主题层）补拍；19:05 后找主出口/电梯和 Grab 上车点，19:20 出发回酒店。","map":"https://www.google.com/maps/search/Terminal+21+Pattaya"},{"time":"19:20–19:50","type":"drive","title":"Terminal 21 → Mytt Hotel Pattaya","desc":"回酒店后不再安排夜逛；明天格兰岛需要早起，优先洗澡和充电。","map":"https://www.google.com/maps/dir/?api=1&origin=Terminal+21+Pattaya&destination=Mytt+Hotel+Pattaya"},{"time":"19:50–20:20","type":"hotel","title":"回酒店、充电、准备格兰岛用品","desc":"泳衣、换洗衣物、现金、防水袋和防晒统一放门口；确认明天船班和天气。","map":"https://www.google.com/maps/search/Mytt+Hotel+Pattaya"}]},"D5":{"label":"第五天","date":"9月30日","title":"格兰岛环岛：Nual → Samae → Tien → Tawaen → TongLang","mapNote":"按“V仔的日记”视频顺时针环岛；船班、海况、租车与返程必须按当天现场复核。","stops":[{"time":"08:00–08:30","title":"早餐、防晒、现金、防水袋","desc":"用户确认平时骑电动车，保留租摩托车环岛方案。出发前核对泰国可用的摩托车驾驶资格、租车保险是否覆盖驾驶人及乘客；带护照/证件复印件、戴头盔。若无合规驾照/保险、下雨或坡路湿滑，改岛上接驳。","label":"酒店准备","map":"https://www.google.com/maps/search/?api=1&query=Mytt%20Hotel%20Pattaya","sources":[["泰国官方游客驾驶证说明","https://www.thailand.go.th/public/issue-focus-detail/001_01_226"]]},{"time":"08:30–09:00","title":"Mytt Hotel Pattaya → Bali Hai Pier","desc":"Grab / 双条车到巴厘海码头；给买票、找登船点和排队留缓冲。","label":"去码头"},{"time":"09:00–09:30","title":"巴厘海码头买票、确认返程船","desc":"先确认公共船和快艇的返程时间；不要等到下午才问最后一班船。","label":"码头","map":"https://www.google.com/maps/search/?api=1&query=Bali%20Hai%20Pier%20Pattaya"},{"time":"09:30–10:20","title":"Bali Hai Pier → Naban Pier 纳班码头","desc":"公共船是主线，快艇为备选；视频线索为公共船约 30 泰铢/单程，快艇约 150 泰铢、约 15 分钟，出发日现场复核。","label":"海上"},{"time":"10:20–10:50","title":"Naban Pier 纳班码头 → 步行街租摩托车","desc":"下船先认码头、步行街和租车店；租金为工作版估算。取车前确认押金/保险/损伤责任，拍车况和仪表，试刹车灯、戴合适头盔；证件不合规或路面湿滑就改接驳。","label":"上岛识别","map":"https://www.google.com/maps/search/?api=1&query=Koh%20Larn%20Naban%20Pier%20motorcycle%20rental"},{"time":"10:50–11:20","title":"Nual Beach","desc":"顺时针第一站；博主评价水质一般，但可作为环岛起点短停、拍照和下水判断点。","label":"景点 1","map":"https://www.google.com/maps/search/?api=1&query=Nual%20Beach%20Koh%20Larn"},{"time":"11:20–11:35","title":"Nual Beach → Samae Beach","desc":"继续按视频顺时针路线骑行；道路有坡，慢行并按现场路况调整。","label":"岛上转场"},{"time":"11:35–12:15","title":"Samae Beach","desc":"第二站；先找海滩入口和遮阳位置，再决定是否游泳，不把停留时间卡死。","label":"景点 2","map":"https://www.google.com/maps/search/?api=1&query=Samae%20Beach%20Koh%20Larn"},{"time":"12:15–12:30","title":"Samae Beach → Tien Beach","desc":"沿岛路短途前往 Tien Beach；不额外叫 Grab，按摩托车或岛上接驳处理。","label":"岛上转场"},{"time":"12:30–13:20","title":"Tien Beach 天海滩：拍照、休息与午餐候选","desc":"这段包含天海滩拍照/休息，并在海滩或岛上就近吃午餐；不要为了餐厅跨岛折返。下面 3 家是 Google Maps 岛上候选，实际距离、接驳和营业以当日地图与现场为准。","label":"午餐 / 海边休息","map":"https://www.google.com/maps/search/?api=1&query=Tien%20Beach%20Koh%20Larn"},{"time":"13:20–13:35","title":"Tien Beach → Tawaen Beach Viewpoint","desc":"离开 Tien 后前往 Tawaen 一带观景点；先看海况和体力，再决定是否进入商业化海滩区域。","label":"岛上转场"},{"time":"13:35–14:05","title":"Tawaen Beach Viewpoint","desc":"先在观景位置看全海湾、确认下方海滩入口，再决定是否继续停留。","label":"景点 4","map":"https://www.google.com/maps/search/?api=1&query=Tawaen%20Beach%20Viewpoint%20Koh%20Larn"},{"time":"14:05–14:35","title":"Tawaen Beach","desc":"博主明确评价这里商业化，但海水清澈；把它作为短停和认路点，不要被水上项目拖过返程缓冲。","label":"景点 5","map":"https://www.google.com/maps/search/?api=1&query=Tawaen%20Beach%20Koh%20Larn"},{"time":"14:35–14:50","title":"Tawaen Beach → TongLang Beach","desc":"继续沿岛路前往 TongLang；以慢行和安全为先。","label":"岛上转场"},{"time":"14:50–15:35","title":"TongLang Beach","desc":"视频中评价海水清澈、坐着看海舒服；这里适合把海岛体验收口，不再新增远处海滩。","label":"景点 6","map":"https://www.google.com/maps/search/?api=1&query=Tonglang%20Beach%20Koh%20Larn"},{"time":"15:35–16:05","title":"TongLang Beach → Naban Pier","desc":"提前离开海滩，回纳班码头还车并确认返程船；不要把最后一班船当成默认方案。","label":"返程转场"},{"time":"16:05–16:50","title":"Naban Pier → Bali Hai Pier","desc":"乘公共船返回芭提雅；视频线索为下午 5 点左右返程，船班与票价按当天现场复核。","label":"海上返程"},{"time":"16:50–17:20","title":"Bali Hai Pier → Mytt Hotel Pattaya","desc":"回 Mytt 放东西、冲洗和休息；海岛返程晚时取消额外夜逛。","label":"回酒店"},{"time":"17:20–18:30","title":"Mytt Hotel Pattaya 洗澡、休息、整理照片","desc":"先恢复体力，再决定是否外出晚餐；如果天气或海况不适合上岛，全天改为芭提雅市区/按摩。","label":"恢复","map":"https://www.google.com/maps/search/?api=1&query=Mytt%20Hotel%20Pattaya"},{"time":"18:30 后","title":"回 Mytt → 芭提雅晚餐候选","desc":"晚餐候选跟在当天时间轴里；优先看回程时间和体力，不为了吃饭再次绕远。","label":"晚餐备选","map":"https://www.google.com/maps/search/?api=1&query=restaurants%20near%20Mytt%20Hotel%20Pattaya"}]},"D6":{"label":"第六天","date":"10月1日","title":"真枪体验 → Khao Chi Chan → Silverlake → Tiffany’s Show","mapNote":"主方案兼顾体验和拍照：上午真枪，下午 Khao Chi Chan + Silverlake；如果更想拍花园，可把上午替换为东芭乐园备选。","stops":[{"time":"08:00–08:30","type":"hotel","title":"早餐、证件、确认战鼠靶场预约","desc":"靶场尚未预约。先确认 10 月 1 日、2 人、约 09:00 时段、套餐总价及取消/订金条件；预约后按确认信息出发。带护照/带照片证件，不饮酒。","map":"https://www.google.com/maps/search/?api=1&query=Battle%20Mouse%20Shooting%20Range%20Pattaya","sources":[["战鼠场馆地址参考","https://you.ctrip.com/sight/pattaya208/5115374.html"],["战鼠场馆与体验信息","https://www.pattayaland.com/en/activities/battle-mouse-gun-shooting-pattaya"]]},{"time":"08:30–09:00","type":"drive","title":"Mytt → Battle Mouse Shooting Range（战鼠射击俱乐部）","desc":"战鼠地址已锁定为 111/11 Moo 12, Nongprue, Banglamung。由芭提雅北部酒店先向南到靶场，再继续去七珍佛山，顺着当天东南方向行程走；车程和 Grab 价格以出发时地图/叫车软件为准。","map":"https://www.google.com/maps/dir/?api=1&origin=Mytt%20Hotel%20Pattaya&destination=Battle%20Mouse%20Shooting%20Range%2C%20111%2F11%20Moo%2012%2C%20Nongprue%2C%20Bang%20Lamung%2C%20Chon%20Buri%2020150"},{"time":"09:00–10:30","type":"","title":"Battle Mouse Shooting Range（战鼠射击俱乐部）真枪体验","desc":"体验待预约。先听教练安全说明，确认套餐包含枪型、弹数和两人总价；预约、年龄/证件要求及拍照规则以场馆书面回复为准。全程不饮酒。","map":"https://www.google.com/maps/search/?api=1&query=Battle%20Mouse%20Shooting%20Range%20Pattaya","sources":[["战鼠场馆地址参考","https://you.ctrip.com/sight/pattaya208/5115374.html"],["战鼠场馆与体验信息","https://www.pattayaland.com/en/activities/battle-mouse-gun-shooting-pattaya"]]},{"time":"10:30–11:15","type":"food","title":"午餐：战鼠附近简餐","desc":"在靶场周边就近选营业中的简餐，避免回芭提雅海滩方向；不要把未经核实的旧餐厅候选当作靶场附近门店。","map":"https://www.google.com/maps/search/?api=1&query=restaurants%20near%20Battle%20Mouse%20Shooting%20Range%20Pattaya"},{"time":"11:15–12:00","type":"drive","title":"战鼠靶场附近 → 七珍佛山","desc":"午餐后从靶场周边继续向东南前往七珍佛山，不折返芭提雅市区；打开路线查看当天车程，Grab/包车价格现场 function cn(s){let out=String(s??'');const saved=[];for(const [en,zh] of bilingualTerms){const re=new RegExp('(^|[^A-Za-z0-9])('+en+')(?=$|[^A-Za-z0-9])','gi');out=out.replace(re,(all,left,word,offset,whole)=>{if(/^（[^）]*）/.test(whole.slice(offset+all.length)))return all;const id=saved.push(word+'（'+zh+'）')-1;return left+String.fromCharCode(0xE000)+id+String.fromCharCode(0xE001)})}const marker=new RegExp(String.fromCharCode(0xE000)+'([0-9]+)'+String.fromCharCode(0xE001),'g');return out.replace(marker,(_,id)=>saved[Number(id)])}
const norm=s=>String(s||'').replace(/[–—−]/g,'-').replace(/\s/g,'').toLowerCase();
const mapHref=(a,b)=>'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a)+'&destination='+encodeURIComponent(b);
function findTransfer(stop){if(DATA.transferMap[stop.title])return DATA.transferMap[stop.title];const q=norm(stop.title);return Object.entries(DATA.transferMap).find(([k])=>norm(k)===q)?.[1]||null;}
function findMeal(stop){const title=norm(stop.title);return Object.entries(DATA.foodSlots||{}).sort((a,b)=>b[0].length-a[0].length).find(([k])=>title.includes(norm(k))||norm(k).includes(title))||null;}
function matchingCreator(dayId,stop){const t=norm(stop.time);return (DATA.creatorRecommendations||[]).filter(r=>r.slot.startsWith(dayId)&&norm(r.slot).includes(t));}
function render(dayId){const day=DATA.days[dayId];document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.day===dayId));document.getElementById('dayhead').innerHTML='<h2>'+esc(cn(day.label))+' · '+esc(day.date)+'</h2><p>'+esc(cn(day.title))+'</p>'+(day.mapNote?'<p>'+esc(cn(day.mapNote))+'</p>':'');
const stops=day.stops||[];document.getElementById('timeline').innerHTML=stops.map(stop=>{const transfer=findTransfer(stop);const meal=findMeal(stop);const creator=matchingCreator(dayId,stop);const isFood=!!meal||/午餐|晚餐|早餐|餐|咖啡|轻食|加餐/.test(stop.title);let details='';
if(creator.length){details='<details class="subdetails"><summary>抖音博主推荐 · '+esc(cn(DATA.creator.blogger))+'（展开看推荐内容）</summary><div class="choices">'+creator.map(r=>'<article class="choice"><b>'+esc(cn(r.name))+'</b><p>'+esc(cn(r.foods||r.category||'博主推荐，按视频内容参考'))+' · '+esc(cn(r.location||'地点待核'))+'</p><a href="'+esc(r.maps||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r.name))+'" target="_blank" rel="noopener">地图位置 ↗</a></article>').join('')+'<a class="link" href="'+esc(DATA.creator.videoUrl)+'" target="_blank" rel="noopener">看 '+esc(cn(DATA.creator.blogger))+' 的原视频 ↗</a></div></details>'}
else if(meal&&meal[1].length){details='<details class="subdetails"><summary>附近吃什么 · 展开 3 家地图候选</summary><div class="choices">'+meal[1].slice(0,3).map((f,i)=>'<article class="choice"><b>'+(i+1)+'. '+esc(cn(f.name))+'</b><p>'+esc(cn(f.type||'餐饮'))+' · '+esc(cn(f.rating||'评分待核'))+' · '+esc(cn(f.price||'价格待核'))+'</p><p>'+esc(cn(f.location||''))+(f.distance?' · '+esc(cn(f.distance)):'')+'</p><a href="'+esc(f.map||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(f.name))+'" target="_blank" rel="noopener">打开门店地图 ↗</a></article>').join('')+'</div></details>'}
let route='';if(transfer){const href=mapHref(transfer.from,transfer.to);route='<div class="route"><b>'+esc(cn(transfer.from))+' → '+esc(cn(transfer.to))+'</b><div class="facts"><span class="fact">'+esc(cn(transfer.mode))+'</span><span class="fact">'+esc(cn(transfer.distance))+'</span><span class="fact">'+esc(cn(transfer.taxiTime))+'</span><span class="fact">'+esc(cn(transfer.fare))+'</span></div><div class="links"><a class="link map" href="'+esc(href)+'" target="_blank" rel="noopener">打开本段路线 ↗</a></div></div>'}
const label=transfer?'转场':isFood?'吃饭 / 补给':/Samala|Mytt|PP Garden|入住|退房|酒店/.test(stop.title)?'酒店 / 准备':'行程';const short=(stop.desc||'').length>105?(stop.desc||'').slice(0,105)+'…':(stop.desc||'');const mapLink=!transfer&&stop.map?'<a class="link map" href="'+esc(stop.map)+'" target="_blank" rel="noopener">地图位置 ↗</a>':'';const sourceLinks=(stop.sources||[]).map(([label,url])=>'<a class="link" href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(label)+' ↗</a>').join('');const detail=(stop.desc||'').length>105?'<details class="subdetails"><summary>展开完整提醒</summary><p class="desc">'+esc(cn(stop.desc))+'</p></details>':'';
return '<article class="item"><div class="time">'+esc(stop.time||'')+'</div><div class="main"><span class="kind">'+label+'</span><div class="title">'+esc(cn(stop.title))+'</div>'+(short?'<p class="desc">'+esc(cn(short))+'</p>':'')+route+'<div class="links">'+mapLink+sourceLinks+'</div>'+detail+details+'</div></article>'}).join('');}
const entries=Object.entries(DATA.days);document.getElementById('tabs').innerHTML=entries.map(([id,d])=>'<button type="button" class="tab" data-day="'+id+'">'+esc(d.label)+'</button>').join('');document.querySelectorAll('.tab').forEach(x=>x.addEventListener('click',()=>render(x.dataset.day)));render(entries[0][0]);</script></body></html>
